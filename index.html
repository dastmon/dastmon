<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DASTMON - Trend Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="h-full flex flex-col">
  <header class="bg-slate-800/50 border-b border-slate-700/60 px-6 py-4 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold text-indigo-300">DASTMON</h1>
      <p class="text-xs text-slate-400">Dashboard Trend Monitoring • <span id="updated">-</span></p>
    </div>
    <div class="flex items-center gap-2">
      <select id="job" class="bg-slate-800 border border-slate-600/50 rounded-xl px-3 py-2 text-sm">
        <option value="">⚡ Jalankan scraper…</option>
        <option value="trends">GetDayTrends</option>
        <option value="teepublic">TeePublic</option>
      </select>
      <button id="sync" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-sm font-medium">Sync</button>
    </div>
  </header>

  <main class="flex-1 p-6 space-y-5 overflow-y-auto">
    <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-700/60 pb-2">
      <div id="tabs" class="flex gap-5 text-sm"></div>
      <input id="q" placeholder="Cari…" class="w-full md:w-72 bg-slate-800/70 border border-slate-700 rounded-xl px-3 py-1.5 text-sm outline-none focus:border-indigo-500">
    </div>
    <p id="msg" class="text-sm text-slate-400"></p>
    <div class="bg-slate-800/30 border border-slate-700/50 rounded-2xl overflow-x-auto">
      <table class="w-full text-left text-sm"><thead id="thead"></thead><tbody id="tbody" class="divide-y divide-slate-700/50"></tbody></table>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
