<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DASTMON | Trend Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>if (localStorage.getItem('dastmon_theme') === 'dark') document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:is(.dark *));
    @theme {
      --font-outfit: "Outfit", sans-serif;
      --text-title-sm: 30px; --text-title-sm--line-height: 38px;
      --text-theme-xl: 20px; --text-theme-xl--line-height: 30px;
      --text-theme-sm: 14px; --text-theme-sm--line-height: 20px;
      --text-theme-xs: 12px; --text-theme-xs--line-height: 18px;
      --shadow-theme-xs: 0px 1px 2px 0px rgba(16,24,40,0.05);
      --shadow-theme-sm: 0px 1px 3px 0px rgba(16,24,40,0.1), 0px 1px 2px 0px rgba(16,24,40,0.06);
      --color-*: initial;
      --color-white: #fff; --color-black: #101828; --color-transparent: transparent;
      --color-brand-25: #f2f7ff; --color-brand-50: #ecf3ff; --color-brand-100: #dde9ff; --color-brand-200: #c2d6ff;
      --color-brand-300: #9cb9ff; --color-brand-400: #7592ff; --color-brand-500: #465fff; --color-brand-600: #3641f5;
      --color-gray-25: #fcfcfd; --color-gray-50: #f9fafb; --color-gray-100: #f2f4f7; --color-gray-200: #e4e7ec;
      --color-gray-300: #d0d5dd; --color-gray-400: #98a2b3; --color-gray-500: #667085; --color-gray-600: #475467;
      --color-gray-700: #344054; --color-gray-800: #1d2939; --color-gray-900: #101828; --color-gray-950: #0c111d;
      --color-success-50: #ecfdf3; --color-success-500: #12b76a; --color-success-600: #039855;
      --color-error-50: #fef3f2; --color-error-500: #f04438; --color-error-600: #d92d20;
      --color-warning-50: #fffaeb; --color-warning-500: #f79009; --color-warning-600: #dc6803;
    }
  </style>
</head>
<body class="bg-gray-50 font-outfit text-base font-normal text-gray-700 dark:bg-gray-900 dark:text-gray-400">
  <aside id="side" class="fixed left-0 top-0 z-9999 flex h-screen w-[290px] -translate-x-full flex-col overflow-y-auto border-r border-gray-200 bg-white px-5 transition-transform duration-300 ease-linear dark:border-gray-800 dark:bg-black lg:translate-x-0">
    <a href="#trending/us" class="flex items-center gap-3 pb-7 pt-8">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-500 text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>
      </span>
      <span class="text-xl font-bold text-gray-800 dark:text-white/90">DASTMON</span>
    </a>
    <h3 class="mb-4 text-xs uppercase leading-[20px] text-gray-400">Menu</h3>
    <nav id="nav" class="space-y-1"></nav>
  </aside>
  <div id="ov" class="fixed inset-0 z-9998 hidden bg-gray-900/50 lg:hidden"></div>

  <div class="lg:ml-[290px]">
    <header class="sticky top-0 z-99999 flex w-full border-gray-200 bg-white lg:border-b dark:border-gray-800 dark:bg-gray-900">
      <div class="flex grow items-center justify-between gap-3 px-3 py-3 lg:px-6 lg:py-4">
        <div class="flex items-center gap-3">
          <button id="burger" aria-label="Buka menu" class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-gray-500 dark:border-gray-800 dark:text-gray-400 lg:hidden">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          </button>
          <div class="relative hidden sm:block">
            <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            </span>
            <input id="gq" type="text" placeholder="Cari data pada tabel…" class="h-11 w-full rounded-lg border border-gray-200 bg-transparent py-2.5 pl-12 pr-4 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-800 dark:bg-white/[0.03] dark:text-white/90 dark:placeholder:text-white/30 xl:w-[430px]">
          </div>
        </div>
        <div class="flex items-center gap-3">
          <p class="hidden text-theme-sm text-gray-500 dark:text-gray-400 md:block">Update: <span id="updated">-</span></p>
          <button id="theme" aria-label="Ganti tema" class="flex h-11 w-11 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800">
            <svg class="hidden dark:block" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="dark:hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          </button>
          <button id="sync" class="inline-flex h-11 items-center gap-2 rounded-lg bg-brand-500 px-4 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600">Sync</button>
        </div>
      </div>
    </header>
    <main id="view" class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
