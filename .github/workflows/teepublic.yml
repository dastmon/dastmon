name: Fetch TeePublic tags

on:
  schedule:
    # Tiap 6 jam, menit ke-17 (hindari antrean jam bulat GitHub).
    # 00:17, 06:17, 12:17, 18:17 UTC = 07:17, 13:17, 19:17, 01:17 WIB
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tes saja (ambil & hitung tag, TIDAK kirim ke backend)'
        type: boolean
        default: true

# Satu run pada satu waktu: run berikutnya menunggu, tidak saling menimpa.
concurrency:
  group: teepublic-fetch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ambil tag dan kirim ke backend
        run: node scripts/fetch-tags.mjs
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # Jadwal (cron) selalu mengirim. Run manual/API mengirim kecuali dry_run bernilai true.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') && 'true' || 'false' }}
